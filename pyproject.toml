[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentone"
dynamic = ["version"]
description = "DTMF tone encoding and decoding in pure Python."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
keywords = ["dtmf", "tones", "audio", "goertzel", "data-over-sound", "telephony"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
# Image-based schemes (sstv, spectrogram) need Pillow to read/write images.
image = ["pillow"]
# DSP schemes (spectrogram synthesis, echo-hiding watermark) use numpy.
dsp = ["numpy"]
all = ["pillow", "numpy"]
test = ["pytest>=7", "pytest-cov", "pillow", "numpy"]

[project.urls]
Homepage = "https://github.com/JarbasAl/OpenTone"

[tool.setuptools.dynamic]
version = {attr = "opentone.version.__version__"}

[tool.setuptools.packages.find]
include = ["opentone*"]
exclude = ["test*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
